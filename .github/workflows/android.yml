# Compile l'APK dans le cloud, sans ordinateur.
#
# Ce fichier suppose que le projet vit dans un sous-dossier « metanoia-app/ »
# du depot. S'il est a la racine, remplacer la valeur de PROJ par un point.
#
# Se declenche a la main depuis l'onglet Actions (bouton « Run workflow »),
# ou a chaque envoi touchant le projet Android. Les modifications de la PWA
# a la racine ne declenchent donc rien.
name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'metanoia-app/**'
      - '.github/workflows/android.yml'

env:
  PROJ: metanoia-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dependances
        working-directory: ${{ env.PROJ }}
        run: npm install

      - name: Synchroniser le web dans Android
        working-directory: ${{ env.PROJ }}
        run: npx cap sync android

      # L'empreinte SHA-1 demandee par Google Sign-In.
      # Elle s'affiche dans le journal de cette etape, bloc « Variant: debug ».
      - name: Empreinte SHA-1
        working-directory: ${{ env.PROJ }}/android
        run: |
          chmod +x gradlew
          ./gradlew signingReport --console=plain

      - name: Compiler l'APK
        working-directory: ${{ env.PROJ }}/android
        run: ./gradlew assembleDebug --console=plain

      - name: Deposer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: metanoia-debug-apk
          path: ${{ env.PROJ }}/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
